<style>
/* Layout: full-height map with a docked record index on the left (bottom sheet on phones). Ink-on-drafting-film palette. */
:root{
  --bg:#f4f4f4; --panel:#ffffff; --ink:#222222; --muted:#5a5f5e; --rule:#dddddd; --grid:#b8bebb; --road:#a3aaa7; --parcel:#7f8884;
  --accent:#0a534b; --brand:#0a534b; --brand-ink:#ffffff; --sand:#ede7dd;
  --mb:#c2571a; --pm:#1f5f8b; --rs:#7a3a96; --tm:#2a7a46; --ct:#b8860b; --cr:#c0262d; --fc:#2e7d32; --mm:#c71585; --sh:#8a5a1f; --ll:#b03a6e; --cc:#a3570c; --rv:#6b4c9a; --sr:#8a6d2a; --om:#1d6e8a; --hap:#7a6a55; --lm:#5a7d0a; --am:#4c5a9a; --gl:#2f6f73; --gc:#2a64a0; --cp:#00838f; --ad:#8c5aa0; --fn:#9a4f1e; --mi:#5b6e8c;
  --display:"Roboto Condensed","Arial Narrow",Arial,sans-serif; --body:Roboto,Arial,sans-serif; --mono:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b211f; --ink:#e3e8e4; --muted:#98a39d; --rule:#2f3834; --grid:#3a4440; --road:#56615b; --parcel:#6c7771;
  --accent:#7fd1c6; --brand:#0a534b; --brand-ink:#ffffff; --sand:#2a2622; --mb:#f08a4b; --pm:#6fb0dd; --rs:#c08ad8; --tm:#6cc48a; --ct:#e0b84a; --cr:#ff6b6b; --fc:#7fd48a; --mm:#ff7ad9; --sh:#d6a565; --ll:#e88bb4; --cc:#f0a660; --rv:#b89ae0; --sr:#d9b96a; --om:#6cc0e0; --hap:#c2ae8f; --lm:#a9cf55; --am:#9eabe6; --gl:#7cc7c9; --gc:#8fb8e8; --cp:#5fd3dc; --ad:#c9a0dc; --fn:#e09a6a; --mi:#9fb3d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b211f; --ink:#e3e8e4; --muted:#98a39d; --rule:#2f3834; --grid:#3a4440; --road:#56615b; --parcel:#6c7771;
  --accent:#7fd1c6; --brand:#0a534b; --brand-ink:#ffffff; --sand:#2a2622; --mb:#f08a4b; --pm:#6fb0dd; --rs:#c08ad8; --tm:#6cc48a; --ct:#e0b84a; --cr:#ff6b6b; --fc:#7fd48a; --mm:#ff7ad9; --sh:#d6a565; --ll:#e88bb4; --cc:#f0a660; --rv:#b89ae0; --sr:#d9b96a; --om:#6cc0e0; --hap:#c2ae8f; --lm:#a9cf55; --am:#9eabe6; --gl:#7cc7c9; --gc:#8fb8e8; --cp:#5fd3dc; --ad:#c9a0dc; --fn:#e09a6a; --mi:#9fb3d6; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;background:var(--brand);color:var(--brand-ink);border-bottom:4px solid var(--sand)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head .eyebrow{color:rgba(255,255,255,.75)}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:4px 0 6px;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.sub{color:rgba(255,255,255,.85);font-size:13px;line-height:1.4}
.search{margin-top:12px;display:flex;gap:0;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.search button{font:inherit;font-family:var(--display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:0 14px;border:0;background:var(--sand);color:var(--brand);cursor:pointer}
.search button:hover{filter:brightness(.95)}
.search input{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 12px;border:0;border-radius:0;background:var(--panel);color:var(--ink)}
.search input::placeholder{color:#777}
.search input:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.layersbox{border-bottom:1px solid var(--rule);flex:none;max-height:45%;overflow:auto}
.layersbox summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg);position:sticky;top:0}
.layersbox summary::-webkit-details-marker{display:none}
.layersbox summary::before{content:"▸";margin-right:8px;transition:transform .15s}
.layersbox[open] summary::before{transform:rotate(90deg)}
.layersbox summary .n{font-weight:400}
.layers{padding:6px max(16px,env(safe-area-inset-left,0px)) 10px;padding-right:16px;display:grid;gap:2px}
.layer{display:grid;grid-template-columns:18px 14px 1fr auto auto auto;align-items:center;gap:8px;padding:5px 4px;border-radius:4px;cursor:pointer}
.layer:hover{background:var(--bg)}
.layer input{margin:0;accent-color:var(--accent)}
.sw{width:14px;height:10px;border:2px solid currentColor;border-radius:2px;background:color-mix(in srgb,currentColor 22%,transparent)}
.sw.pt{width:10px;height:10px;border-radius:50%;justify-self:center;background:currentColor}
.sw.ln{height:0;border-width:1px 0 0;background:none}
.layer .dl{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--accent);cursor:pointer;line-height:1.2}
.layer .dl:hover{border-color:var(--accent)}
.layer .dl:disabled{opacity:.6;cursor:progress}
.layers .all{grid-column:1/-1;margin:4px 4px 0;font-size:12px}
.layers .all a{color:var(--accent);font-weight:600;text-decoration:none}
.layers .all a:hover{text-decoration:underline}
/* Link box: shown when the page is embedded somewhere that refuses new tabs and downloads (e.g. claude.ai for visitors who are not signed in). */
.linkbox{position:fixed;inset:0;z-index:2100;background:color-mix(in srgb,var(--bg) 72%,transparent);display:grid;place-items:center;padding:16px}
.linkbox .card{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 32px rgb(0 0 0 / .22);padding:16px 18px;width:min(460px,100%);display:grid;gap:10px}
.linkbox h3{font-family:var(--display);font-size:19px;margin:0;line-height:1.15;color:var(--brand)}
.linkbox p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.linkbox .url{display:flex;gap:6px}
.linkbox input{flex:1;min-width:0;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink)}
.linkbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbox button,.linkbox a.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none}
.linkbox button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.linkbox .st{font-size:12px;color:var(--muted);flex:1;min-width:120px}
.layer .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{flex:1;overflow:auto;min-height:40%}
.list h2{position:sticky;top:0;background:var(--sand);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700;margin:0;padding:10px 16px 6px;border-bottom:1px solid var(--rule)}
.item{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 16px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.item:hover,.item.on{background:var(--bg)}
.tag{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 6px;border-radius:3px;border:1px solid currentColor;align-self:start;white-space:nowrap}
.item .t{font-size:13px;line-height:1.3;min-width:0}
.item .m{grid-column:2;font-size:12px;color:var(--muted)}
.empty{padding:16px;color:var(--muted)}
#map{height:100%;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:var(--body)}
.leaflet-control-zoom a,.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--rule)}
.leaflet-control-scale-line{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--ink);border-color:var(--ink)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--accent)}
.lbl{background:none;border:0;box-shadow:none;padding:0;font-family:var(--mono);font-size:11px;font-weight:500;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 2px var(--bg);white-space:nowrap}
.lbl::before{display:none}
.seclbl{font-family:var(--display);font-size:22px;font-weight:600;color:var(--muted);opacity:.85;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);background:none;border:0;box-shadow:none}
.seclbl::before{display:none}
.roadlbl{display:inline-block;transform-origin:center;font-family:var(--body);font-style:italic;font-size:12px;line-height:1;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 2px var(--bg)}
.apnlbl{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 2px var(--bg)}
.seclbl.seclbl-sm{font-size:13px;font-weight:500;opacity:.8}
.twplbl{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.info{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:500;width:min(340px,calc(100% - 24px));background:var(--panel);border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 24px rgb(0 0 0 / .14);padding:14px 16px;max-height:70%;overflow:auto}

// External links and downloads. When this page is embedded in a frame that refuses new tabs and downloads (claude.ai does
// this for visitors who are not signed in), window.open returns null — then we show the link so it can be copied instead.
function openExternal(url,opt){
 let w=null; try{w=window.open(url,"_blank")}catch(e){}
 if(w){try{w.opener=null}catch(e){} return true}
 showLinkBox(url,opt||{}); return false;
}
function showLinkBox(url,opt){
 const old=document.querySelector(".linkbox"); if(old) old.remove();
 const box=document.createElement("div"); box.className="linkbox"; box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true"); box.setAttribute("aria-label",opt.title||"Open link");
 box.innerHTML=`<div class="card"><h3></h3><p class="note"></p><p>This embedded view can't open new tabs or start downloads on its own. Copy the link and paste it into a new browser tab.</p><div class="url"><input type="text" readonly spellcheck="false" aria-label="Link"><button type="button" class="primary cp">Copy link</button></div><div class="row"><a class="btn op" data-raw="1" target="_blank" rel="noopener">Open ↗</a><span class="st" aria-live="polite"></span><button type="button" class="cl">Close</button></div></div>`;
 box.querySelector("h3").textContent=opt.title||"Open link";
 const note=box.querySelector(".note"); if(opt.note) note.textContent=opt.note; else note.remove();
 const inp=box.querySelector("input"); inp.value=url; inp.addEventListener("focus",()=>inp.select());
 const st=box.querySelector(".st");
 const a=box.querySelector("a.op"); a.href=url;
 a.addEventListener("click",e=>{ e.preventDefault(); let w=null; try{w=window.open(url,"_blank")}catch(x){} if(w){try{w.opener=null}catch(x){} st.textContent="Opened in a new tab."} else st.textContent="Blocked here — copy the link instead."; });
 box.querySelector(".cp").addEventListener("click",async()=>{
  let ok=false; try{await navigator.clipboard.writeText(url); ok=true}catch(e){}
  if(!ok){try{inp.focus(); inp.select(); ok=document.execCommand("copy")}catch(e){}}
  if(ok) st.textContent="Link copied — paste it into a new tab."; else {st.textContent="Couldn't copy automatically — select the link and press Ctrl+C (⌘C)."; inp.focus(); inp.select();}
 });
 const close=()=>{box.remove(); document.removeEventListener("keydown",esc)}; const esc=e=>{if(e.key==="Escape") close()};
 box.querySelector(".cl").addEventListener("click",close); box.addEventListener("click",e=>{if(e.target===box) close()}); document.addEventListener("keydown",esc);
 document.body.appendChild(box); box.querySelector(".cp").focus();
}
document.addEventListener("click",e=>{
 const a=e.target.closest&&e.target.closest('a[target="_blank"]');
 if(!a||a.dataset.raw||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
 e.preventDefault(); openExternal(a.href,{title:(a.textContent||"Link").replace(/\s*↗\s*$/,"").trim()});
});

const map=L.map("map",{zoomControl:true,preferCanvas:true,attributionControl:true,zoomSnap:.5});
map.attributionControl.setPrefix(false).addAttribution("Parcels &amp; streets: Mono County GIS · PLSS: CalGEM (BLM &amp; DPR) · Postmiles: Caltrans · Imagery: USGS The National Map");
L.control.scale({imperial:true,metric:false}).addTo(map);
map.fitBounds([[37.46,-119.65],[38.71,-117.83]]);

(async function main(){
 const LOADING=document.getElementById("loading");
 const QBOX=document.getElementById("q"), LIST0=document.getElementById("list");
 const PH=QBOX.placeholder; QBOX.placeholder="Loading records…"; QBOX.setAttribute("aria-busy","true");
 LIST0.innerHTML='<h2>Loading county records…</h2><div class="empty">The record index is downloading (about 15 MB). Search works as soon as it finishes.</div>';
 let DATA={},county,sectionsFC,roadsFC,twFC;
 try{
  const [c,sec,rd,tw,...layers]=await Promise.all([getJSON("data/county.json"),getJSON("data/sections.json"),getJSON("data/roads_county.json"),getJSON("data/townships.json"),...DEFS.map(d=>getJSON(`data/${d.file}.json`))]);
  county=c; sectionsFC=sec; roadsFC=rd; twFC=tw; DEFS.forEach((d,i)=>DATA[d.key]=layers[i]);
 }catch(e){LOADING.textContent="Could not load the map data ("+e.message+").";QBOX.placeholder="Records failed to load";LIST0.innerHTML='<div class="empty">Could not load the record index: '+esc(e.message)+'. Reload the page to try again.</div>';return}
 QBOX.placeholder=PH; QBOX.removeAttribute("aria-busy");

 // base layers
 const twp=L.geoJSON(county,{style:()=>({color:css("--ink"),weight:2,fill:false,dashArray:"8 5"}),interactive:false});
 const secs=L.geoJSON(sectionsFC,{style:()=>({color:css("--grid"),weight:1,fill:false}),interactive:false}).addTo(map);
 const twps=L.geoJSON(twFC,{style:()=>({color:css("--muted"),weight:1.8,opacity:.75,fill:false}),interactive:false}).addTo(map);
 let plssOn=true;
 const roadStyle=f=>/^Highway/.test(f.properties.T||"")&&!/Crossover/.test(f.properties.T)?{color:css("--ink"),weight:3,opacity:.6}:{color:css("--road"),weight:1.6,opacity:.9};
 const roads=L.geoJSON(roadsFC,{style:roadStyle,interactive:false}).addTo(map);
 let roadsOn=true;
 const imagery=L.layerGroup([
 ]).addTo(map);
 map.createPane("imagery").style.zIndex=150;
 let imageryOn=true; const IMG=[];
 function syncImagery(){
  const z=map.getZoom(), v=map.getBounds().pad(.15);
  for(const o of IMG){ const want=imageryOn&&z>=o._z0&&z<o._z1&&v.intersects(o._b);
   if(want&&!imagery.hasLayer(o)) imagery.addLayer(o); else if(!want&&imagery.hasLayer(o)) imagery.removeLayer(o); }
 }
 getJSON("data/imagery.json").then(list=>{ for(const it of list){ const o=L.imageOverlay(it.url,it.bounds,{pane:"imagery",interactive:false,zIndex:it.z??1}); o._b=L.latLngBounds(it.bounds); o._z0=it.minzoom??0; o._z1=it.maxzoom??99; IMG.push(o);} syncImagery(); }).catch(()=>{});
 map.on("moveend zoomend",syncImagery);
 let parcels=null, parcelsOn=true, parcelsLoading=null;
 const parcelStyle=()=>({color:css("--parcel"),weight:.6,opacity:.7,fillOpacity:0});
 function ensureParcels(){
   if(parcels||parcelsLoading) return parcelsLoading;
   parcelsLoading=getJSON("data/parcels.json").then(fc=>{parcels=L.geoJSON(fc,{style:parcelStyle,interactive:false});const n=document.getElementById("pcount");if(n)n.textContent=fc.features.length.toLocaleString();syncParcels();relabel();});
   return parcelsLoading;
 }
 function syncParcels(){
   const want=parcelsOn&&map.getZoom()>=PARCEL_ZOOM;
   if(want&&!parcels){ensureParcels();return}
   if(!parcels) return;
   if(want&&!map.hasLayer(parcels)) parcels.addTo(map); else if(!want&&map.hasLayer(parcels)) map.removeLayer(parcels);
 }

 const groups={},items=[];
 for(const d of DEFS){
  const fc=DATA[d.key], color=()=>css("--"+d.id);
  const g=d.point
   ? L.geoJSON(fc,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4.5,color:"#fff",weight:1.2,opacity:.5625,fillColor:color(),fillOpacity:.5625,interactive:false})})
   : L.geoJSON(fc,{style:()=>d.outline?({color:color(),weight:2,opacity:.5625,dashArray:"6 4",fill:false}):({color:color(),weight:1.4,opacity:.5625,fillColor:color(),fillOpacity:.0675}),interactive:false});
  g.eachLayer(l=>{
   const p=l.feature.properties,tag=d.tag(p);
   const b=d.point?null:l.getBounds();
   items.push({d,p,l,tag,b,title:d.title(p),text:(tag+" "+Object.values(p).join(" ")).toLowerCase()});
  });
  groups[d.id]=g; if(d.on) g.addTo(map);
 }

 // dynamic labels (only what's in view, zoomed in)
 const labelLayer=L.layerGroup().addTo(map), secLabelLayer=L.layerGroup().addTo(map);
 const lab=(ll,text,cls,color)=>L.marker(ll,{interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="${cls}" style="${color?`color:${color}`:""}">${esc(text)}</span>`,iconSize:null})});
 function relabel(){
  labelLayer.clearLayers(); secLabelLayer.clearLayers();
  const z=map.getZoom(), v=map.getBounds();
  if(plssOn&&z>=9&&z<14){ twps.eachLayer(l=>{ if(v.intersects(l.getBounds())) secLabelLayer.addLayer(lab(l.getBounds().getCenter(),l.feature.properties.TR,"twplbl")); }); }
  if(plssOn&&z>=SEC_ZOOM){ let n=0; secs.eachLayer(l=>{ if(n<300&&v.intersects(l.getBounds())){ n++; secLabelLayer.addLayer(lab(l.getBounds().getCenter(),z>=14?l.feature.properties.TRS:String(l.feature.properties.S),z>=14?"seclbl seclbl-sm":"seclbl")); } }); }
  if(parcels&&map.hasLayer(parcels)&&z>=APN_ZOOM){ let k=0; parcels.eachLayer(l=>{ if(k>=500) return; const b=l.getBounds(); if(!v.intersects(b)) return; const pw=map.latLngToContainerPoint(b.getNorthEast()).x-map.latLngToContainerPoint(b.getSouthWest()).x; if(pw<42) return; const a=String(l.feature.properties.APN||""); if(!a) return; secLabelLayer.addLayer(lab(b.getCenter(),a.slice(0,3)+"-"+a.slice(3,6)+"-"+a.slice(6,9),"apnlbl")); k++; }); }
  if(roadsOn&&z>=16){ // one label per street, centred on and rotated along the longest visible run of its centerline
   const runs=new Map();
   roads.eachLayer(l=>{ const n=l.feature.properties.N; if(!n) return; const lines=l.feature.geometry.type==="MultiLineString"?l.getLatLngs():[l.getLatLngs()];
    for(const line of lines){ let run=[]; const flush=()=>{ if(run.length>1){ let len=0; for(let i=1;i<run.length;i++) len+=map.latLngToContainerPoint(run[i]).distanceTo(map.latLngToContainerPoint(run[i-1])); const best=runs.get(n); if(!best||len>best.len) runs.set(n,{len,run}); } run=[]; };
     for(const p of line){ if(v.contains(p)) run.push(p); else flush(); } flush(); } });
   let k=0;
